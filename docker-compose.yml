version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: handicapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-handicapp_db}
      POSTGRES_USER: ${DB_USER:-handicapp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-handicapp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - handicapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-handicapp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./back-handicapp
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: handicapp-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-handicapp_db}
      DB_USER: ${DB_USER:-handicapp_user}
      DB_PASSWORD: ${DB_PASSWORD:-handicapp_password}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://handicapp.com.ar}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - handicapp-network
    volumes:
      - ./back-handicapp/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js
  frontend:
    build:
      context: ./front-handicapp
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.handicapp.com.ar}
    container_name: handicapp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.handicapp.com.ar}
    depends_on:
      - backend
    networks:
      - handicapp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  handicapp-network:
    driver: bridge
